<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 130">
  <defs>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#d4e6ee"/>
      <path d="M 0 0 L 6 6 M 6 0 L 0 6" stroke="#1b262c" stroke-width="1.3"/>
    </pattern>
    <pattern id="rim" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#d4e6ee"/>
      <path d="M 0 4 L 4 0 L 8 4 L 4 8 Z" fill="none" stroke="#1b262c" stroke-width="1.2"/>
    </pattern>
  </defs>
  <g stroke="#1b262c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="#d4e6ee">
    <!-- Top center egg -->
    <ellipse cx="82" cy="40" rx="18" ry="24"/>
    <!-- Left upper egg -->
    <ellipse cx="52" cy="54" rx="18" ry="22" transform="rotate(-18 52 54)"/>
    <!-- Right upper egg -->
    <ellipse cx="110" cy="52" rx="18" ry="22" transform="rotate(18 110 52)"/>
    <!-- Front left egg -->
    <ellipse cx="40" cy="72" rx="19" ry="18"/>
    <!-- Front middle egg -->
    <ellipse cx="82" cy="66" rx="20" ry="22"/>
    <!-- Front right egg -->
    <ellipse cx="118" cy="72" rx="19" ry="18"/>
    <!-- Basket lower body -->
    <path d="M 22 86 L 28 116 C 29 120 34 122 40 122 L 120 122 C 126 122 131 120 132 116 L 138 86 Z" fill="url(#weave)"/>
    <!-- Basket bottom base band -->
    <path d="M 28 114 L 132 114 L 130 120 C 129 122 125 123 120 123 L 40 123 C 35 123 31 122 30 120 Z" fill="#d4e6ee"/>
    <!-- Basket rim -->
    <rect x="14" y="74" width="132" height="14" rx="7" ry="7" fill="url(#rim)"/>
  </g>
</svg>
