<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FEED EGGS — Nude Egg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Authentication Gate Overlay -->
  <div id="auth-gate-overlay" class="auth-gate-overlay">
    <div id="auth-gate-loading" class="auth-gate-card">
      <div class="auth-gate-spinner"></div>
      <p class="auth-gate-desc">CHECKING CREDENTIALS...</p>
    </div>
    <div id="auth-gate-denied" class="auth-gate-card hidden">
      <h2 class="auth-gate-title">ACCESS DENIED</h2>
      <p class="auth-gate-desc">You must be signed in to the 4HGS Application Hub to access this game.</p>
      <a href="/" class="auth-gate-link">GO TO HUB LOGIN</a>
    </div>
  </div>

  <div id="viewport">
    <div id="stage">
      <!-- Retro Macintosh Window Frame -->
      <div class="window-frame">
        <div class="title-bar">
          <div class="stripes"></div>
        </div>
        <div class="window-body">
          <h1 class="game-title">FEED EGGS</h1>

          <!-- Egg Character (moves to center during pants/mooning phases) -->
          <div id="egg-character" class="egg-character">
            <img src="assets/egg-open.svg" class="sprite active" data-frame="open" alt="Egg open mouth" draggable="false" />
            <img src="assets/egg-closed.svg" class="sprite" data-frame="closed" alt="Egg chewing" draggable="false" />
            <img src="assets/egg-pants-1.svg" class="sprite" data-frame="pants-1" alt="Egg frame" draggable="false" />
            <img src="assets/egg-pants-2.svg" class="sprite" data-frame="pants-2" alt="Egg frame" draggable="false" />
            <img src="assets/egg-pants-3.svg" class="sprite" data-frame="pants-3" alt="Egg frame" draggable="false" />
            <img src="assets/egg-pants-4.svg" class="sprite" data-frame="pants-4" alt="Egg frame" draggable="false" />
            <img src="assets/egg-pants-5.svg" class="sprite" data-frame="pants-5" alt="Egg frame" draggable="false" />
            <img src="assets/egg-moon-1.svg" class="sprite" data-frame="moon-1" alt="Egg frame" draggable="false" />
            <img src="assets/egg-moon-2.svg" class="sprite" data-frame="moon-2" alt="Egg frame" draggable="false" />
            <img src="assets/egg-moon-3.svg" class="sprite" data-frame="moon-3" alt="Egg frame" draggable="false" />
            <img src="assets/egg-moon-4.svg" class="sprite" data-frame="moon-4" alt="Egg frame" draggable="false" />
            <img src="assets/egg-moon-5.svg" class="sprite" data-frame="moon-5" alt="Egg frame" draggable="false" />
            <img src="assets/egg-moon-6.svg" class="sprite" data-frame="moon-6" alt="Egg frame" draggable="false" />
            <!-- Invisible mouth drop target -->
            <div id="mouth-target" class="mouth-target"></div>
          </div>

          <!-- Basket & Egg Counter -->
          <div id="basket-area" class="basket-area">
            <div id="basket-hitbox" class="basket-hitbox" title="Drag an egg to the mouth">
              <img src="assets/basket.svg" class="basket-img" alt="Basket of eggs" draggable="false" />
            </div>
            <div id="egg-counter" class="egg-counter hidden">EGGS: 80</div>
          </div>

          <!-- Ghost trail + dragged egg -->
          <div id="drag-layer" class="drag-layer">
            <img id="ghost-egg-2" src="assets/egg-small.svg" class="drag-egg ghost-2 hidden" alt="" draggable="false" />
            <img id="ghost-egg-1" src="assets/egg-small.svg" class="drag-egg ghost-1 hidden" alt="" draggable="false" />
            <img id="drag-egg" src="assets/egg-small.svg" class="drag-egg hidden" alt="" draggable="false" />
          </div>

          <!-- Small/Medium Popup Window (6 EGGS, Warning, 40 eggs, 41 EGGS, Nude Egg) -->
          <div id="popup-box" class="retro-modal popup-small hidden">
            <div class="modal-title-bar">
              <div class="stripes"></div>
            </div>
            <div class="modal-content" id="popup-content">
              <div id="popup-text" class="popup-text">6 EGGS</div>
              <img id="popup-warning" src="assets/warning.svg" class="popup-warning hidden" alt="Warning" draggable="false" />
            </div>
          </div>

          <!-- Large Purchase Dialog Window (Step 4) -->
          <div id="purchase-modal" class="retro-modal popup-large hidden">
            <div class="modal-title-bar">
              <div class="stripes"></div>
            </div>
            <div class="modal-content purchase-content">
              <p id="purchase-prompt" class="purchase-text">
                Dude, you ran out of eggs.<br />
                Would you like to buy<br />
                an 80 pack of eggs?
              </p>
              <form id="purchase-form" autocomplete="off">
                <input
                  id="purchase-input"
                  type="text"
                  class="purchase-input"
                  maxlength="20"
                  aria-label="Buy 80 pack of eggs response"
                />
              </form>
            </div>
          </div>

          <!-- Restart / Game Over Prompt (Step 4 refusal or Step 10) -->
          <div id="restart-modal" class="retro-modal popup-restart hidden">
            <div class="modal-title-bar">
              <div class="stripes"></div>
            </div>
            <div class="modal-content restart-content">
              <p id="restart-text" class="popup-text">PLAY AGAIN?</p>
              <button id="restart-btn" type="button" class="retro-btn">RESTART GAME</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Custom in-stage hand cursor -->
      <img id="hand-cursor" src="assets/hand-open.svg" class="hand-cursor hidden" alt="" draggable="false" />
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
